<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Processing Complete</title>

    <style>

        body {

            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;

        }

        .header {

            background: #1F4E78;
            color: white;
            text-align: center;
            padding: 25px;

        }

        .header h1 {

            margin: 0;
            font-size: 42px;

        }

        .container {

            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;

        }

        .summary-card {

            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);

        }

        .success {

            color: #368F1E;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 30px;

        }

        .grid {

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;

        }

        .stat-box {

            background: #f4f6f9;
            border-radius: 14px;
            padding: 25px;
            text-align: center;

        }

        .stat-label {

            font-size: 18px;
            color: #666;
            margin-bottom: 10px;

        }

        .stat-value {

            font-size: 34px;
            font-weight: bold;
            color: #1F4E78;

        }

        .download-section {

            text-align: center;
            margin-top: 45px;

        }

        .download-btn {

            background: #1F4E78;
            color: white;
            border: none;
            padding: 18px 42px;
            border-radius: 12px;
            font-size: 22px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;

        }

        .download-btn:hover {

            background: #163a5a;

        }

        .footer {

            text-align: center;
            margin-top: 30px;
            color: #777;

        }

    </style>

</head>

<body>

    <div class="header">

        <h1>Billing Extraction Complete</h1>

    </div>

    <div class="container">

        <div class="summary-card">

            <div class="success">

                ✓ Processing Successful

            </div>

            <div class="grid">

                <div class="stat-box">

                    <div class="stat-label">
                        PDFs Processed
                    </div>

                    <div class="stat-value">
                        {{ pdf_count }}
                    </div>

                </div>

                <div class="stat-box">

                    <div class="stat-label">
                        Rows Extracted
                    </div>

                    <div class="stat-value">
                        {{ row_count }}
                    </div>

                </div>

                <div class="stat-box">

                    <div class="stat-label">
                        Total Charges
                    </div>

                    <div class="stat-value">
                        ${{ total_charges }}
                    </div>

                </div>

                <div class="stat-box">

                    <div class="stat-label">
                        Confidence
                    </div>

                    <div class="stat-value">
                        {{ confidence }}%
                    </div>

                </div>

            </div>

            <div class="download-section">

                <a
                    href="/download"
                    class="download-btn"
                >
                    Download Excel Report
                </a>

            </div>

        </div>

        <div class="footer">

            City Utility Billing Automation System

        </div>

    </div>

</body>

</html>
