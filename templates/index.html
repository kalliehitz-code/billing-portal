<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Utility Billing Portal</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;

        }

        .top-bar {

            background: #1F4E78;
            color: white;
            text-align: center;
            padding: 25px 20px;

        }

        .logo {

            height: 80px;
            margin-bottom: 10px;

        }

        .top-bar h1 {

            margin: 0;
            font-size: 42px;

        }

        .top-bar p {

            margin-top: 10px;
            font-size: 20px;
            opacity: 0.9;

        }

        .container {

            max-width: 900px;
            margin: 50px auto;
            padding: 40px;

        }

        .card {

            background: white;
            border-radius: 18px;
            padding: 50px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);

        }

        .upload-area {

            border: 3px dashed #1F4E78;
            border-radius: 16px;
            padding: 70px 30px;
            text-align: center;
            background: #f9fbfd;
            transition: 0.25s;
            cursor: pointer;

        }

        .upload-area:hover {

            background: #eef5fb;

        }

        .upload-area.dragover {

            background: #dceeff;
            border-color: #368F1E;

        }

        .upload-title {

            font-size: 40px;
            color: #1F4E78;
            margin-bottom: 15px;
            font-weight: bold;

        }

        .upload-subtitle {

            font-size: 20px;
            color: #666;

        }

        #file-input {

            display: none;

        }

        .button-wrap {

            text-align: center;
            margin-top: 35px;

        }

        button {

            background: #1F4E78;
            color: white;
            border: none;
            padding: 18px 42px;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;

        }

        button:hover {

            background: #163a5a;

        }

        .footer {

            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 14px;

        }

        .loading-overlay {

            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.92);
            z-index: 9999;

            justify-content: center;
            align-items: center;
            flex-direction: column;

        }

        .spinner {

            width: 90px;
            height: 90px;
            border: 10px solid #d9e1f2;
            border-top: 10px solid #1F4E78;
            border-radius: 50%;
            animation: spin 1s linear infinite;

        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }

        .loading-text {

            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #1F4E78;

        }

    </style>

</head>

<body>

    <div class="top-bar">

        <img
            src="{{ url_for('static', filename='logo.jpg') }}"
            class="logo"
        >

        <h1>Utility Billing Portal</h1>

        <p>
            Automated PDF Extraction & Excel Reporting
        </p>

    </div>

    <div class="container">

        <div class="card">

            <form
                id="upload-form"
                action="/upload"
                method="POST"
                enctype="multipart/form-data"
            >

                <label
                    for="file-input"
                    class="upload-area"
                    id="upload-area"
                >

                    <div class="upload-title">
                        Drag & Drop PDF Bills Here
                    </div>

                    <div class="upload-subtitle">
                        or click to browse files
                    </div>

                </label>

                <input
                    type="file"
                    id="file-input"
                    name="files"
                    multiple
                    accept=".pdf"
                    required
                >

                <div class="button-wrap">

                    <button type="submit">
                        Process Bills
                    </button>

                </div>

            </form>

            <div class="footer">

                City Utility Billing Automation System

            </div>

        </div>

    </div>

    <div
        class="loading-overlay"
        id="loading-overlay"
    >

        <div class="spinner"></div>

        <div class="loading-text">
            Processing Bills...
        </div>

    </div>

    <script>

        const uploadArea = document.getElementById("upload-area");

        const fileInput = document.getElementById("file-input");

        const uploadForm = document.getElementById("upload-form");

        const loadingOverlay = document.getElementById("loading-overlay");


        uploadArea.addEventListener("dragover", (e) => {

            e.preventDefault();

            uploadArea.classList.add("dragover");

        });


        uploadArea.addEventListener("dragleave", () => {

            uploadArea.classList.remove("dragover");

        });


        uploadArea.addEventListener("drop", (e) => {

            e.preventDefault();

            uploadArea.classList.remove("dragover");

            fileInput.files = e.dataTransfer.files;

        });


        uploadForm.addEventListener("submit", () => {

            loadingOverlay.style.display = "flex";

        });

    </script>

</body>

</html>
