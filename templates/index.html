<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Utility Billing Portal</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;

        }

        .header {

            background-color: #1F4E78;
            color: white;
            text-align: center;
            padding: 25px;

        }

        .header img {

            height: 80px;
            margin-bottom: 10px;

        }

        .header h1 {

            margin: 0;
            font-size: 48px;

        }

        .header p {

            margin-top: 10px;
            font-size: 22px;

        }

        .main {

            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;

        }

        .card {

            background: white;
            border-radius: 18px;
            padding: 50px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);

        }

        .upload-box {

            border: 3px dashed #1F4E78;
            border-radius: 18px;
            padding: 80px 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #f8fbff;

        }

        .upload-box:hover {

            background: #edf5fc;

        }

        .upload-box.dragover {

            background: #dceeff;
            border-color: #368F1E;

        }

        .upload-title {

            font-size: 44px;
            font-weight: bold;
            color: #1F4E78;
            margin-bottom: 20px;

        }

        .upload-subtitle {

            font-size: 22px;
            color: #666;

        }

        #file-input {

            display: none;

        }

        .button-row {

            text-align: center;
            margin-top: 35px;

        }

        button {

            background-color: #1F4E78;
            color: white;
            border: none;
            padding: 18px 42px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;

        }

        button:hover {

            background-color: #163a5a;

        }

        .footer {

            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 14px;

        }

        .loading {

            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.92);
            z-index: 9999;

            justify-content: center;
            align-items: center;
            flex-direction: column;

        }

        .spinner {

            width: 90px;
            height: 90px;
            border: 10px solid #d9e1f2;
            border-top: 10px solid #1F4E78;
            border-radius: 50%;
            animation: spin 1s linear infinite;

        }

        .loading-text {

            margin-top: 20px;
            font-size: 28px;
            color: #1F4E78;
            font-weight: bold;

        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }

        .progress-container {

            display: none;
            margin-top: 30px;

        }

        .progress-text {

            font-size: 22px;
            font-weight: bold;
            color: #1F4E78;
            margin-bottom: 12px;
            text-align: center;

        }

        .progress-bar-bg {

            width: 100%;
            height: 28px;
            background: #d9e1f2;
            border-radius: 20px;
            overflow: hidden;

        }

        .progress-bar {

            width: 0%;
            height: 100%;
            background: #368F1E;
            transition: 0.4s;

        }

        .file-list {

            margin-top: 35px;

        }

        .file-card {

            background: #f4f6f9;
            border: 1px solid #d9e1f2;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;

        }

        .file-name {

            font-size: 18px;
            font-weight: bold;
            color: #1F4E78;

        }

        .file-size {

            color: #666;
            margin-top: 5px;

        }

    </style>

</head>

<body>

    <div class="header">

        <img src="{{ url_for('static', filename='logo.jpg') }}">

        <h1>Utility Billing Portal</h1>

        <p>Automated PDF Extraction & Excel Reporting</p>

    </div>

    <div class="main">

        <div class="card">

            <form
                id="upload-form"
                action="/upload"
                method="POST"
                enctype="multipart/form-data"
            >

                <div
                    class="upload-box"
                    id="upload-box"
                >

                    <div class="upload-title">
                        Drag & Drop PDF Bills Here
                    </div>

                    <div class="upload-subtitle">
                        or click to browse files
                    </div>

                </div>

                <input
                    type="file"
                    id="file-input"
                    name="files"
                    multiple
                    accept=".pdf"
                    required
                >

                <div class="file-list" id="file-list"></div>

                <div
                    class="progress-container"
                    id="progress-container"
                >

                    <div
                        class="progress-text"
                        id="progress-text"
                    >
                        Preparing Upload...
                    </div>

                    <div class="progress-bar-bg">

                        <div
                            class="progress-bar"
                            id="progress-bar"
                        ></div>

                    </div>

                </div>

                <div class="button-row">

                    <button type="submit">
                        Process Bills
                    </button>

                </div>

            </form>

            <div class="footer">

                City Utility Billing Automation System

            </div>

        </div>

    </div>

    <div
        class="loading"
        id="loading"
    >

        <div class="spinner"></div>

        <div class="loading-text">
            Processing Bills...
        </div>

    </div>

    <script>

        const uploadBox = document.getElementById("upload-box");

        const fileInput = document.getElementById("file-input");

        const form = document.getElementById("upload-form");

        const loading = document.getElementById("loading");

        const fileList = document.getElementById("file-list");

        const progressContainer = document.getElementById("progress-container");

        const progressBar = document.getElementById("progress-bar");

        const progressText = document.getElementById("progress-text");


        uploadBox.addEventListener("click", () => {

            fileInput.click();

        });


        uploadBox.addEventListener("dragover", (e) => {

            e.preventDefault();

            uploadBox.classList.add("dragover");

        });


        uploadBox.addEventListener("dragleave", () => {

            uploadBox.classList.remove("dragover");

        });


        uploadBox.addEventListener("drop", (e) => {

            e.preventDefault();

            uploadBox.classList.remove("dragover");

            fileInput.files = e.dataTransfer.files;

            displayFiles(fileInput.files);

        });


        fileInput.addEventListener("change", () => {

            displayFiles(fileInput.files);

        });


        function displayFiles(files) {

            fileList.innerHTML = "";

            Array.from(files).forEach(file => {

                const fileCard = document.createElement("div");

                fileCard.className = "file-card";

                fileCard.innerHTML = `

                    <div class="file-name">
                        ${file.name}
                    </div>

                    <div class="file-size">
                        ${(file.size / 1024).toFixed(1)} KB
                    </div>

                `;

                fileList.appendChild(fileCard);

            });

        }


        form.addEventListener("submit", () => {

            loading.style.display = "flex";

            progressContainer.style.display = "block";

            let progress = 0;

            const interval = setInterval(() => {

                progress += 10;

                progressBar.style.width = progress + "%";

                progressText.innerText =
                    "Processing Bills... " + progress + "%";

                if (progress >= 90) {

                    clearInterval(interval);

                }

            }, 400);

        });

    </script>

</body>

</html>
